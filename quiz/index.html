<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
   <h1>🚀 Think your a quiz master ?</h1>
   <h3>Test your skills and try to ace this challange 👍</h3>  
   <button class="Start" onclick="start()">Start quiz</button>
   <div class="container">
   
   </div>
   <div id="submissionModal" class="modal hidden">
    <div class="modal-content">
        <p>Are you sure you want to submit your attempts?</p>
        <button id="confirm-btn" class="confirm">Yes</button>
        <button id="cancel-btn" class="cancel">No</button>
    </div>
    </div>
    <!-- Time's Up Modal -->
<div id="time-up-notification" class="timeup hide">
  <div class="time-up-content">
      <p>Oops! Your time is up ⏳</p>
      <button id="viewscore" class="view-score">View Score</button>
  </div>
</div>
  <script src="index.js"></script>
</body>
</html>
